### 0. Experiment
experiment:
  name: "Experiments"
  # Must end with a separator: setup_logging and the pickle dump both
  # string-concatenate onto it rather than using os.path.join.
  log_patch_address: "Experiments/runs/"
  device: "cuda"

### 1.Model
model:
  # 'mmseg' in the name selects the SegFormerB0/B5 loaders in
  # pretrained_models/models.py; '_b0' / '_b5' picks the variant.
  name: 'mmseg_segformer_b0'
  ckpt_dir: '/pfs/work9/workspace/scratch/ma_nilbecke-thesis/checkpoints'
  # slide = the thesis evaluation procedure: crop and stride come from the
  # checkpoint's own test_cfg (1024 / 768). At the 1024x1024 training crop that
  # is ONE window, so patch training is unaffected; at the 1024x2048 evaluation
  # frame it is three, which is the point of setting it.
  slide: True
  slide_checkpoint: False
  align_corners: False

### 2. Data
dataset:
  name: "cityscapes"
  # NOT the cityscapes dir itself: __getitem__ joins root + 'cityscapes' +
  # relpath, and the list files are opened as root + list_path. So root is the
  # PARENT, train.txt/val.txt live in it, and entries are relative to
  # root/cityscapes/. Generated by scripts/make_lists.py in this repo.
  # Absolute cluster path, matching $CS=.../data/cityscapes in the main repo's
  # launch scripts -- this is its PARENT, per the note above.
  root: "/pfs/work9/workspace/scratch/ma_nilbecke-thesis/data/"
  train: "train.txt"
  test: "test.txt"
  val: "val.txt"
  trainval: "trainval.txt"
  num_classes: 19

### 3. Patch
patch:
  # 256 (not their 200). At the 1024x1024 training crop that is 6.25% of the
  # frame; at the 1024x2048 evaluation frame it is 3.1%, which matches
  # patch_scale 0.25 of height in the thesis runs. Their published number is a
  # 200x200 patch (1.9% of the eval frame), so drops are NOT directly
  # comparable to theirs without noting the area difference.
  size: 256
  #loc: "corner"
  #loc: "random"
  loc: "center"


### 3.Optimizer
optimizer:
  optimizer: "sgd"
  init_lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: False
  exponentiallr: True
  exponentiallr_gamma: 0.995

## 4. Loss
loss:
  use_ohem: True
  ohemthres: 0.9
  ohemkeep: 131072
  balance_weights: [0.4, 1.0]
  sb_weights: 1.0


### 5.Training 
train:
  width: 1024
  height: 1024
  base_size: 2048
  flip: True
  shuffle: True
  ignore_label: 255
  num_workers: 4
  pin_memory: True
  drop_last: False
  batch_size: 1     # adjust according to gpu resources
  # 2 -> 4. Each worker is single-threaded now (cv2.setNumThreads(0) in
  # dataset/base_dataset.py), so parallelism has to come from worker count.
  # The augmentation is heavy -- a resize of up to 2.1x a 2048x1024 frame per
  # sample -- so too few workers starves the GPU. 4 on an 8-core CPU leaves
  # room for the main process.
  multi_scale: True
  scale_factor: 16
  power: 2.5
  # Was 1, i.e. one logger line per image -- 2975 console lines per epoch,
  # which also fights the tqdm bar in trainer.train() since both write to
  # stderr. The bar carries live loss/mIoU now; this is just the periodic
  # checkpoint that lands in Experiments/runs/logs/exp_debug.log.
  log_per_iters: 500
  start_epoch: 0
  end_epoch: 30
  # finetune: False
  # finetune_add: '/content/drive/MyDrive/Colab Notebooks/1_Papers/2_RobustRealtimeSS/1_Pretraining_cityscape/1_PIDNet/experiments/pidnet_s_crop1024x1024_ExponentialLR0995_batch10_basesize2048_randscale0_5to2/checkpoints/2025-01-02 08:36:14 EST-0500_141_0.648.pth.tar'


### 6. Test
test:
  width: 2048
  height: 1024
  base_size: 1024
  batch_size: 1
  output_index_pidnet: 1 # at index 1, we have I branch output
  output_index_icnet: 0
  output_index_bisenet: 0
  num_workers: 2
  pin_memory: True
  drop_last: False
  multi_scale: False
  flip_test: False
  
